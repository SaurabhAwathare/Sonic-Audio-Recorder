# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Performance Optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX support
android.useAndroidX=true
# Jetifier is generally not needed for modern projects, but keeping it for compatibility if any old libs exist
android.enableJetifier=true

# Kotlin style
kotlin.code.style=official

# Non-transitive R classes for faster builds
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false

# Room KSP performance and compatibility
ksp.incremental=true
