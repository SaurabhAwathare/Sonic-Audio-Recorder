[versions]
#noinspection AndroidGradlePluginVersion
agp = "8.7.3"
#noinspection NewerVersionAvailable,NewerVersionAvailable
kotlin = "2.1.0"
#noinspection GradleDependency
coreKtx = "1.15.0"
junit = "4.13.2"
#noinspection GradleDependency
junitVersion = "1.2.1"
#noinspection GradleDependency
espressoCore = "3.6.1"
#noinspection GradleDependency,GradleDependency
lifecycle = "2.8.7"
#noinspection GradleDependency
activityCompose = "1.9.3"
#noinspection GradleDependency
composeBom = "2024.11.00"
room = "2.8.4"
#noinspection NewerVersionAvailable,NewerVersionAvailable,NewerVersionAvailable
hilt = "2.55"
#noinspection GradleDependency
navigationCompose = "2.8.4"
ksp = "2.1.0-1.0.29"
#noinspection GradleDependency
media3 = "1.4.1"
